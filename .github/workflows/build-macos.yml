name: Build macOS Development App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# This workflow creates development artifacts only. Official releases are made
# by script/package-release.mjs on the configured signing Mac.
jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install project-matched Wails CLI
        run: |
          WAILS_VERSION="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_VERSION}"

      - name: Build development macOS App bundle
        env:
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '1'
        run: wails3 task darwin:package

      - name: Zip unsigned development artifact
        run: ditto -c -k --sequesterRsrc --keepParent "bin/pzssh.app" "bin/pzssh-macos-${{ matrix.arch }}-unsigned-development.zip"

      - name: Upload development artifact
        uses: actions/upload-artifact@v4
        with:
          name: pzssh-macos-${{ matrix.arch }}-unsigned-development
          path: bin/pzssh-macos-${{ matrix.arch }}-unsigned-development.zip
